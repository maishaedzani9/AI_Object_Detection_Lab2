[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-object-detection-lab"
version = "1.0.0"
description = "YOLOv8 object detection and ByteTrack tracking demonstration"
requires-python = ">=3.10,<3.12"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
